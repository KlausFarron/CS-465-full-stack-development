<!-- <pre>{{trips | json}}</pre> --> 
 <div *ngIf="isLoggedIn()">
    <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>
<!-- Search form for finding trips by keyword and price -->
<form *ngIf="searchForm && isLoggedIn()" [formGroup]="searchForm" (ngSubmit)="onSearch()" class="row g-2 align-items-end mt-3">
    <div class="col-md-4">
        <label>Search:</label>
        <input type="text" formControlName="keyword" maxlength="50"
            placeholder="Trip or resort name" class="form-control">
    </div>
    <div class="col-md-2">
        <label>Min price:</label>
        <input type="number" formControlName="minPrice" min="0" step="0.01" class="form-control">
    </div>
    <div class="col-md-2">
        <label>Max price:</label>
        <input type="number" formControlName="maxPrice" min="0" step="0.01" class="form-control">
    </div>
    <div class="col-md-4">
        <button type="submit" class="btn btn-info">Search</button>
        <button type="button" *ngIf="isSearching" (click)="clearSearch()" class="btn btn-link">Clear</button>
    </div>
</form>
<!-- Shows how many trips were found, or a message when there are none -->
<p *ngIf="message" class="mt-3">{{ message }}</p>
<div class="row"> 
    <div *ngFor="let trip of trips" class="col-md-4"> 
        <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card> 
    </div> 
 </div>
